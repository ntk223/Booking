version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: booking_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - booking_network

volumes:
  redis_data:
    driver: local

networks:
  booking_network:
    driver: bridge