version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: booking_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: meetingroombooking
      MYSQL_USER: booking_user
      MYSQL_PASSWORD: booking_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./meetingroombooking (1).sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - booking_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:latest
    container_name: booking_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - booking_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # MySQL Exporter for Prometheus
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: booking_mysql_exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    volumes:
      - "./.my.cnf:/.my.cnf:ro"
    command:
      - "--config.my-cnf=/.my.cnf"
    networks:
      - booking_network
    depends_on:
      mysql:
        condition: service_healthy

  # Redis Exporter for Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: booking_redis_exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://booking_redis:6379"
    networks:
      - booking_network
    depends_on:
      redis:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:latest
    container_name: booking_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - booking_network
    depends_on:
      loki:
        condition: service_healthy

  loki:
    image: grafana/loki:2.8.0
    container_name: booking_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - booking_network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  promtail:
    image: grafana/promtail:2.8.0
    container_name: booking_promtail
    restart: unless-stopped
    ports:
      - "9080:9080"
    volumes:
      - ./BE/logger/promtail-config.yaml:/etc/promtail/config.yml
      - ./BE/logger/logs:/app/logs
    command: -config.file=/etc/promtail/config.yml
    networks:
      - booking_network
    depends_on:
      loki:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: booking_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - booking_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  booking_network:
    driver: bridge
